<svg viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" font-family="'Arial Black','Impact',sans-serif">
  <defs>
    <!-- night sky → ember haze -->
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1a0d06"/>
      <stop offset="45%" stop-color="#3d1c08"/>
      <stop offset="75%" stop-color="#7a3209"/>
      <stop offset="100%" stop-color="#d6610f"/>
    </linearGradient>

    <!-- fire gradient -->
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%"   stop-color="#fff3b0"/>
      <stop offset="30%"  stop-color="#ffb627"/>
      <stop offset="60%"  stop-color="#ff6b00"/>
      <stop offset="100%" stop-color="#c1121f" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="emberGlow" cx="50%" cy="100%" r="90%">
      <stop offset="0%"  stop-color="#ff8c1a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#ff5500" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter>
    <filter id="blur8"><feGaussianBlur stdDeviation="8"/></filter>

    <filter id="textGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <clipPath id="frame"><rect width="900" height="300" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <!-- sky -->
    <rect width="900" height="300" fill="url(#sky)"/>

    <!-- rising smoke plumes -->
    <g fill="#1a0f08" opacity="0.55" filter="url(#blur8)">
      <ellipse cx="300" cy="120" rx="130" ry="90">
        <animate attributeName="cy" values="160;40;160" dur="14s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;0.15;0.5" dur="14s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse cx="620" cy="100" rx="150" ry="100">
        <animate attributeName="cy" values="150;30;150" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.45;0.1;0.45" dur="18s" repeatCount="indefinite"/>
      </ellipse>
    </g>

    <!-- burning house silhouette (right side, behind smoke, above flames) -->
    <g fill="#0c0703">
      <!-- body -->
      <rect x="640" y="120" width="180" height="115"/>
      <!-- roof -->
      <polygon points="630,120 730,62 830,120"/>
      <!-- chimney -->
      <rect x="785" y="78" width="18" height="40"/>
    </g>
    <!-- windows glowing fire -->
    <g fill="url(#fire)">
      <rect x="662" y="145" width="30" height="40"><animate attributeName="opacity" values="0.7;1;0.7" dur="1.3s" repeatCount="indefinite"/></rect>
      <rect x="715" y="145" width="30" height="40"><animate attributeName="opacity" values="1;0.6;1" dur="1.7s" repeatCount="indefinite"/></rect>
      <rect x="768" y="145" width="30" height="40"><animate attributeName="opacity" values="0.6;1;0.6" dur="1.1s" repeatCount="indefinite"/></rect>
    </g>

    <!-- ground ember glow -->
    <rect x="0" y="200" width="900" height="100" fill="url(#emberGlow)"/>

    <!-- FLAMES along the bottom — flickering tongues -->
    <g fill="url(#fire)" filter="url(#blur4)">
      <path d="M0 300 Q 60 220 90 300 Q 120 200 160 300 Q 200 230 240 300 Z">
        <animate attributeName="d"
          values="M0 300 Q 60 220 90 300 Q 120 200 160 300 Q 200 230 240 300 Z;
                  M0 300 Q 60 245 90 300 Q 120 235 160 300 Q 200 200 240 300 Z;
                  M0 300 Q 60 220 90 300 Q 120 200 160 300 Q 200 230 240 300 Z"
          dur="0.9s" repeatCount="indefinite"/>
      </path>
      <path d="M220 300 Q 290 195 330 300 Q 370 215 420 300 Q 460 190 510 300 Z">
        <animate attributeName="d"
          values="M220 300 Q 290 195 330 300 Q 370 215 420 300 Q 460 190 510 300 Z;
                  M220 300 Q 290 230 330 300 Q 370 185 420 300 Q 460 235 510 300 Z;
                  M220 300 Q 290 195 330 300 Q 370 215 420 300 Q 460 190 510 300 Z"
          dur="0.7s" repeatCount="indefinite"/>
      </path>
      <path d="M480 300 Q 560 205 610 300 Q 660 195 720 300 Q 780 220 840 300 Q 880 200 900 300 Z">
        <animate attributeName="d"
          values="M480 300 Q 560 205 610 300 Q 660 195 720 300 Q 780 220 840 300 Q 880 200 900 300 Z;
                  M480 300 Q 560 240 610 300 Q 660 230 720 300 Q 780 185 840 300 Q 880 240 900 300 Z;
                  M480 300 Q 560 205 610 300 Q 660 195 720 300 Q 780 220 840 300 Q 880 200 900 300 Z"
          dur="1.1s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- EMBERS / sparks rising -->
    <g fill="#ffcc33">
      <circle cx="120" cy="290" r="2"><animate attributeName="cy" values="300;-10" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="5s" repeatCount="indefinite"/></circle>
      <circle cx="260" cy="290" r="1.6"><animate attributeName="cy" values="300;-10" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="6.5s" repeatCount="indefinite"/></circle>
      <circle cx="430" cy="290" r="2.2"><animate attributeName="cy" values="300;-10" dur="4.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="600" cy="290" r="1.8"><animate attributeName="cy" values="300;-10" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="710" cy="290" r="2"><animate attributeName="cy" values="300;-10" dur="5.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="5.6s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="290" r="1.5"><animate attributeName="cy" values="300;-10" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="6s" repeatCount="indefinite"/></circle>
      <circle cx="350" cy="290" r="1.4"><animate attributeName="cy" values="300;-10" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="8s" repeatCount="indefinite"/></circle>
    </g>

    <!-- TITLE — graffiti-ish, skewed, ember-lit -->
    <g transform="skewX(-6)" filter="url(#textGlow)">
      <text x="70" y="150" font-size="78" font-weight="900" fill="#fff3b0" stroke="#7a1f00" stroke-width="2" letter-spacing="1">LYFESTYLE</text>
    </g>
    <text x="84" y="185" font-size="15" font-weight="700" fill="#ffb627" letter-spacing="6" transform="skewX(-6)">DEK0RTA · BRYANSK · 2093</text>
  </g>
</svg>
